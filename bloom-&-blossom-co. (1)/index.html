<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom & Blossom Co.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#A93B59',
              secondary: '#F2D7D9',
              accent: '#D98BA0',
              neutral: '#F2F2F2',
              base: '#FFFFFF',
              text: '#333333',
            },
            fontFamily: {
              sans: ['"Playfair Display"', 'serif'],
              body: ['"Lato"', 'sans-serif'],
            },
            keyframes: {
              pulseQuantity: {
                '0%, 100%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.3)', color: '#A93B59' },
              }
            },
            animation: {
              'pulse-quantity': 'pulseQuantity 0.4s ease-in-out',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet">
